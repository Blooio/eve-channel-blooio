# Publishes eve-channel-blooio to npm on every version tag push, with an npm
# provenance attestation so anyone can cryptographically verify the package was
# built by this exact workflow, from this exact repository and commit.
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# Option A — OIDC Trusted Publishing (recommended, no long-lived secrets):
#   1. Log in to npmjs.com and open the eve-channel-blooio package settings.
#   2. Under "Publish access" -> "Trusted Publishers", click "Add a publisher".
#   3. Select GitHub Actions and fill in:
#        Repository owner: Blooio
#        Repository name:  eve-channel-blooio
#        Workflow name:    publish.yml
#        Environment:      (leave blank)
#   4. Leave the NPM_TOKEN secret unset. GitHub's OIDC token is used instead.
#
# Option B — npm Automation Token (fallback):
#   1. npmjs.com -> Access Tokens -> Generate a Granular Access Token scoped to
#      this package with read/write publish permission.
#   2. GitHub -> repo Settings -> Secrets and variables -> Actions -> New secret
#      named NPM_TOKEN.
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
# Run `npm run release` locally to lint, test, build, bump the version, tag
# (vX.Y.Z) and push — which triggers this workflow.

name: Publish

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm
        # OIDC trusted publishing requires npm >= 11.5.1; Node LTS ships npm 10.x.
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm publish --provenance --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
